<!doctype html>
<html lang="es-PE">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gestión Humana · Prototipo RR.HH.</title>
<!-- Prototipo navegable del Módulo de RR.HH. — archivo único (CSS y JS incluidos), sin backend ni dependencias.
     Fuente: "Especificación Funcional y Visual para el Prototipo del Módulo de Recursos Humanos" y Plan Maestro (14 dominios, 50 módulos). -->
<style>
/* Guía visual — Especificación sección 16 (lineamientos) y 17 (responsive) */
:root{
  --brand:#0F5C7A; --brand-d:#0b4760; --brand-l:#e3eff4;
  --bg:#F5F7F9; --surface:#fff; --text:#1F2933; --muted:#5B6875; --border:#D9DEE3;
  --gray:#6B7280; --gray-bg:#F1F2F4;
  --blue:#2563EB; --blue-bg:#DBEAFE;
  --amber:#B45309; --amber-bg:#FEF3C7;
  --green:#047857; --green-bg:#D1FAE5;
  --red:#B91C1C; --red-bg:#FEE2E2;
  --purple:#6D28D9; --purple-bg:#EDE9FE;
  --teal:#0F766E; --teal-bg:#CCFBF1;
  --r:8px; --r-s:4px;
  --shadow:0 8px 24px rgba(15,23,42,.14);
  --font:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:var(--font);font-size:14px;color:var(--text);background:var(--bg);line-height:1.45}
a{color:var(--brand)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid #7cc2dd;outline-offset:2px}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ---------- Shell ---------- */
.hdr{grid-area:hdr;display:flex;align-items:center;gap:8px;padding:0 16px;background:var(--surface);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:30}
.hdr .logo{display:inline-flex;align-items:center;gap:9px;font-weight:700;font-size:16px;color:var(--brand-d);white-space:nowrap;cursor:pointer;background:none;border:0;padding:4px}
.hdr .grow{flex:1}
.hdr select{height:36px;border:1px solid var(--border);border-radius:var(--r-s);padding:0 8px;background:#fff;max-width:220px}
.hdr .hbtn{height:36px;border:1px solid var(--border);border-radius:var(--r);background:#fff;padding:0 10px;display:inline-flex;align-items:center;gap:6px;cursor:pointer;white-space:nowrap}
.hdr .hbtn:hover{background:var(--bg)}
.count{background:var(--red);color:#fff;border-radius:10px;font-size:11px;padding:0 6px;min-width:18px;text-align:center;line-height:18px}
.search{position:relative}
.search input{height:36px;border:1px solid var(--border);border-radius:var(--r);padding:0 10px;width:240px}
.search .res{position:absolute;top:40px;left:0;width:340px;background:#fff;border:1px solid var(--border);border-radius:var(--r);box-shadow:var(--shadow);z-index:40;max-height:360px;overflow:auto}
.search .res h4{margin:8px 12px 4px;font-size:11px;text-transform:uppercase;color:var(--muted)}
.search .res button{display:block;width:100%;text-align:left;border:0;background:none;padding:8px 12px;cursor:pointer}
.search .res button:hover{background:var(--bg)}
.main{grid-area:main;padding:18px 32px 48px;min-width:0}
.crumb{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.crumb a{color:var(--muted);text-decoration:none}.crumb a:hover{text-decoration:underline}
.ph{display:flex;align-items:flex-start;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.ph h1{font-size:24px;margin:0;line-height:1.2}
.ph .sub{color:var(--muted);margin-top:4px}
.ph .acts{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.code{font-size:11px;color:var(--muted);border:1px solid var(--border);border-radius:var(--r-s);padding:1px 6px;margin-left:8px;vertical-align:middle;font-weight:400}

/* ---------- Componentes ---------- */
.btn{height:40px;padding:0 16px;border-radius:var(--r);border:1px solid var(--brand);background:#fff;color:var(--brand);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;font-weight:600;white-space:nowrap}
.btn:hover{background:var(--brand-l)}
.btn.primary{background:var(--brand);color:#fff}
.btn.primary:hover{background:var(--brand-d)}
.btn.danger{border-color:var(--red);color:var(--red)}
.btn.danger.fill{background:var(--red);color:#fff}
.btn.text{border:0;background:none;padding:0 6px;height:auto;font-weight:600}
.btn.sm{height:32px;padding:0 10px;font-size:13px}
.btn[disabled],.btn[aria-disabled=true]{opacity:.45;cursor:not-allowed}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:16px}
.card h2{font-size:16px;margin:0 0 12px}
.card + .card{margin-top:16px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:2fr 1fr}.g2e{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}
.kpi{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:14px 16px;cursor:pointer;text-align:left;width:100%}
.kpi:hover{border-color:var(--brand)}
.kpi .v{font-size:26px;font-weight:700;margin-top:4px}
.kpi .l{color:var(--muted);font-size:13px}
.kpi.alert .v{color:var(--red)}
.badge{display:inline-flex;align-items:center;gap:4px;border-radius:var(--r-s);padding:2px 8px;font-size:12px;font-weight:600;white-space:nowrap}
.b-gray{background:var(--gray-bg);color:var(--gray)}.b-blue{background:var(--blue-bg);color:var(--blue)}.b-amber{background:var(--amber-bg);color:var(--amber)}
.b-green{background:var(--green-bg);color:var(--green)}.b-red{background:var(--red-bg);color:var(--red)}.b-purple{background:var(--purple-bg);color:var(--purple)}
.origin{border:1px solid;border-radius:var(--r-s);padding:1px 6px;font-size:11px;font-weight:600}
.o-legal{color:#1e3a8a;border-color:#1e3a8a}.o-empresa{color:var(--teal);border-color:var(--teal)}.o-contrato{color:var(--gray);border-color:var(--gray)}.o-convenio{color:var(--purple);border-color:var(--purple)}
.alert{border-radius:var(--r);padding:12px 14px;margin-bottom:16px;border:1px solid;display:flex;gap:10px;align-items:flex-start}
.alert .a-body{flex:1}
.a-info{background:var(--blue-bg);border-color:#bfdbfe;color:#1e3a8a}.a-ok{background:var(--green-bg);border-color:#a7f3d0;color:#065f46}
.a-warn{background:var(--amber-bg);border-color:#fde68a;color:#78350f}.a-err{background:var(--red-bg);border-color:#fecaca;color:#7f1d1d}
.kpi.alert{display:block;margin:0;padding:14px 16px;border:1px solid var(--border);background:var(--surface);color:var(--text)}
.kpi.alert:hover{border-color:var(--brand)}
.a-gray{background:var(--gray-bg);border-color:var(--border);color:var(--text)}
.muted{color:var(--muted)}.small{font-size:12px}.right{text-align:right}.num{text-align:right;font-variant-numeric:tabular-nums}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.sp{flex:1}
hr{border:0;border-top:1px solid var(--border);margin:16px 0}

/* Tabla */
.tbl-wrap{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);overflow:auto}
table.tbl{width:100%;border-collapse:collapse}
.tbl th{text-align:left;font-size:12px;color:var(--muted);font-weight:600;padding:10px 12px;border-bottom:1px solid var(--border);background:#fafbfc;position:sticky;top:0;white-space:nowrap}
.tbl td{padding:10px 12px;border-bottom:1px solid #eef1f3;vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl td.num{white-space:nowrap}
.tbl tr.click{cursor:pointer}.tbl tr.click:hover td{background:#f8fafb}
.tbl tr.sel td{background:var(--brand-l)}
.tbl tr.flash td{animation:flash 2.5s}
@keyframes flash{0%{background:#fff7c2}100%{background:transparent}}
.pager{display:flex;gap:6px;align-items:center;justify-content:flex-end;padding:10px 12px;border-top:1px solid var(--border);background:#fff}
.empty{padding:40px 16px;text-align:center;color:var(--muted)}
.empty .ico{font-size:32px;opacity:.5}
.empty b{display:block;color:var(--text);margin:6px 0}

/* Filtros */
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;align-items:flex-end}
.filters select,.filters input{height:36px;border:1px solid var(--border);border-radius:var(--r-s);padding:0 8px;background:#fff}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.chip{border:1px solid var(--border);background:#fff;border-radius:16px;padding:4px 12px;cursor:pointer}
.chip.on{background:var(--brand);color:#fff;border-color:var(--brand)}

/* Formularios */
.form{display:grid;grid-template-columns:1fr 1fr;gap:16px 20px}
.form .full{grid-column:1/-1}
.fld label{display:block;font-weight:600;font-size:13px;margin-bottom:4px}
.fld .req{color:var(--red)}
.fld input,.fld select,.fld textarea{width:100%;height:40px;border:1px solid var(--border);border-radius:var(--r-s);padding:0 10px;background:#fff}
.fld textarea{height:88px;padding:8px 10px;resize:vertical}
.fld input[type=checkbox],.fld input[type=radio]{width:auto;height:auto}
.fld input[readonly]{background:var(--bg)}
.fld .help{font-size:12px;color:var(--muted);margin-top:4px}
.fld .err{font-size:12px;color:var(--red);margin-top:4px;min-height:0}
.fld.has-err input,.fld.has-err select,.fld.has-err textarea{border-color:var(--red)}
.fld.has-err .err::before{content:"⚠ "}
.opt{display:flex;gap:8px;align-items:flex-start;padding:10px;border:1px solid var(--border);border-radius:var(--r);cursor:pointer;margin-bottom:8px;background:#fff}
.opt input{margin-top:3px}
.opt.on{border-color:var(--brand);background:var(--brand-l)}

/* Stepper */
.stepper{display:flex;gap:4px;margin-bottom:16px;flex-wrap:wrap;counter-reset:st}
.stepper li{list-style:none;flex:1;min-width:120px;padding:8px 10px;border-bottom:3px solid var(--border);color:var(--muted);font-size:13px}
.stepper li.cur{border-color:var(--brand);color:var(--text);font-weight:600}
.stepper li.done{border-color:var(--green);color:var(--green)}
.stepper .compact{display:none}
.footbar{display:flex;gap:8px;justify-content:flex-end;padding:12px 0;border-top:1px solid var(--border);margin-top:16px;position:sticky;bottom:0;background:var(--bg)}
.footbar .left{margin-right:auto}

/* Tabs */
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--border);margin-bottom:16px;overflow-x:auto}
.tabs button{border:0;background:none;padding:10px 14px;cursor:pointer;color:var(--muted);border-bottom:3px solid transparent;white-space:nowrap;font-weight:600}
.tabs button.on{color:var(--brand);border-color:var(--brand)}
.tabs-select{display:none;width:100%;height:40px;margin-bottom:12px;border:1px solid var(--border);border-radius:var(--r-s)}

/* Ficha */
.fhead{display:flex;gap:14px;align-items:center;margin-bottom:12px;flex-wrap:wrap}
.avatar{width:52px;height:52px;border-radius:50%;background:var(--brand-l);color:var(--brand-d);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:18px;flex:none}
.avatar.sm{width:30px;height:30px;font-size:12px}
.dl{display:grid;grid-template-columns:180px 1fr;gap:6px 12px;margin:0}
.dl dt{color:var(--muted)}.dl dd{margin:0}
.timeline{list-style:none;margin:0;padding:0}
.timeline li{position:relative;padding:0 0 14px 20px;border-left:2px solid var(--border);margin-left:6px}
.timeline li::before{content:"";position:absolute;left:-7px;top:3px;width:12px;height:12px;border-radius:50%;background:#fff;border:2px solid var(--brand)}
.timeline .t{font-size:12px;color:var(--muted)}

/* Asistencia */
.att{border-collapse:collapse;font-size:12px;width:100%}
.att th,.att td{border:1px solid #edf0f2;padding:4px;text-align:center;min-width:30px}
.att th{background:#fafbfc;color:var(--muted);font-weight:600;position:sticky;top:0}
.att td.nm{text-align:left;min-width:160px;position:sticky;left:0;background:#fff;font-weight:600}
.att td.cell{cursor:pointer}
.att td.cell:hover{outline:2px solid var(--brand);outline-offset:-2px}
.r-OK{color:var(--green)}.r-TARD{color:var(--amber);background:var(--amber-bg)}.r-SAL{color:var(--amber);background:var(--amber-bg)}
.r-FALTA{color:var(--red);background:var(--red-bg)}.r-INC{color:var(--purple);background:var(--purple-bg)}
.r-CONC{color:var(--teal);background:var(--teal-bg)}.r-VAC{color:var(--blue);background:var(--blue-bg)}.r-JUST{color:var(--gray);background:var(--gray-bg)}
.legend{display:flex;gap:10px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-bottom:10px}
.legend span b{display:inline-block;width:22px;text-align:center;border-radius:3px}

/* Overlays */
.overlay{position:fixed;inset:0;background:rgba(15,23,42,.4);z-index:50;display:flex;align-items:center;justify-content:center;padding:16px}
.modal{background:#fff;border-radius:var(--r);box-shadow:var(--shadow);width:600px;max-width:100%;max-height:92vh;display:flex;flex-direction:column}
.modal.s{width:420px}.modal.l{width:820px}
.modal header,.drawer header{padding:16px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px}
.modal header h2,.drawer header h2{font-size:18px;margin:0;flex:1}
.x{border:0;background:none;font-size:22px;cursor:pointer;line-height:1;padding:4px;color:var(--muted)}
.modal .mb,.drawer .mb{padding:16px 20px;overflow:auto;flex:1}
.modal footer,.drawer footer{padding:12px 20px;border-top:1px solid var(--border);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.drawer-ov{position:fixed;inset:0;background:rgba(15,23,42,.3);z-index:45}
.drawer{position:fixed;top:0;right:0;bottom:0;width:480px;max-width:100%;background:#fff;box-shadow:var(--shadow);z-index:46;display:flex;flex-direction:column}
#toast-root{position:fixed;right:16px;bottom:16px;z-index:60;display:flex;flex-direction:column;gap:8px}
.toast{background:#fff;border-left:4px solid var(--green);box-shadow:var(--shadow);border-radius:var(--r);padding:12px 14px;min-width:280px;max-width:420px;display:flex;gap:10px;align-items:center}
.toast.err{border-color:var(--red)}.toast.info{border-color:var(--blue)}.toast.warn{border-color:var(--amber)}
.menu-pop{position:absolute;right:16px;top:52px;background:#fff;border:1px solid var(--border);border-radius:var(--r);box-shadow:var(--shadow);z-index:41;width:300px;padding:8px}
.menu-pop button,.menu-pop a{display:block;width:100%;text-align:left;border:0;background:none;padding:8px 10px;border-radius:6px;cursor:pointer;color:var(--text);text-decoration:none}
.menu-pop button:hover{background:var(--bg)}
.npanel .item{padding:10px;border-bottom:1px solid var(--border);cursor:pointer}
.npanel .item.unread{background:#f3f8fb}
.npanel .item:hover{background:var(--bg)}

/* Skeleton */
.sk{background:linear-gradient(90deg,#eceff2 25%,#f6f7f9 50%,#eceff2 75%);background-size:200% 100%;animation:sk 1.2s infinite;border-radius:6px}
@keyframes sk{0%{background-position:200% 0}100%{background-position:-200% 0}}

/* Login */
.login{max-width:980px;margin:40px auto;padding:0 16px}
.login h1{color:var(--brand)}
.ucards{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.ucard{background:#fff;border:1px solid var(--border);border-radius:var(--r);padding:14px;cursor:pointer;text-align:left;display:flex;gap:10px;align-items:center}
.ucard:hover,.ucard:focus-visible{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-l)}

/* Portal */
.qa{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.qa button{background:#fff;border:1px solid var(--border);border-radius:var(--r);padding:16px 8px;cursor:pointer;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:6px;min-height:84px}
.qa button .i{width:24px;height:24px;color:var(--brand)}
.qa button:hover{border-color:var(--brand)}
.bnav{display:none}
.list-i{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--border)}
.list-i:last-child{border-bottom:0}
.weeks .wk{display:flex;align-items:center;gap:10px;padding:8px;border:1px solid var(--border);border-radius:var(--r);margin-bottom:8px}


.crumb .sep{color:#b6bec6;margin:0 2px}
.crumb b{color:var(--text);font-weight:600}
/* Mapa del sistema */
.mapgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
.mapgrid .card + .card{margin-top:0}
.mcard .mh{display:flex;gap:10px;align-items:flex-start;margin-bottom:6px}
.mcard .mh h2{margin:0}
.mcard .ico{width:34px;height:34px;border-radius:8px;background:var(--brand);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;flex:none}
.mcard .sub-h{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin:10px 0 2px;font-weight:600}
.mcard ul{margin:0;padding-left:18px}
.mcard li{margin:3px 0}
.mcard li.lock{color:#9aa4ae;list-style:none;margin-left:-18px}
/* KPI estático, calendario, organigrama, barras, turnos */
.kpi.static{cursor:default}
.kpi.static:hover{border-color:var(--border)}
.kpi .v .badge{font-size:14px}
.calgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:16px}
.calgrid .card + .card{margin-top:0}
.daybox{display:inline-flex;flex-direction:column;align-items:center;justify-content:center;width:44px;height:44px;border-radius:8px;background:var(--brand-l);color:var(--brand-d);flex:none;line-height:1.1}
.daybox span{font-size:11px}
.list-i.past{opacity:.55}
.tree ul{list-style:none;margin:0;padding-left:26px;border-left:1px dashed var(--border)}
.tree > ul{padding-left:0;border-left:0}
.tree li{margin:8px 0;position:relative}
.tree ul ul li::before{content:"";position:absolute;left:-26px;top:22px;width:22px;border-top:1px dashed var(--border)}
.node{display:inline-flex;gap:10px;align-items:center;padding:8px 12px;border:1px solid var(--border);border-radius:8px;background:#fff}
.barwrap{flex:1;background:var(--gray-bg);border-radius:4px;height:10px;min-width:60px;overflow:hidden;display:inline-block;vertical-align:middle;width:100px}
.bar{height:10px;background:var(--brand);border-radius:4px}
.brow{display:flex;gap:10px;align-items:center;margin:6px 0}
.brow span{width:150px;font-size:13px}
.brow .barwrap{width:auto}
.sh{font-weight:700}
.sh-A{background:#e0f2fe;color:#075985}.sh-B{background:#fef3c7;color:#92400e}.sh-C{background:#ede9fe;color:#5b21b6}.sh-D{background:var(--gray-bg);color:var(--gray)}
b.sh{display:inline-block;width:22px;text-align:center;border-radius:3px}


/* ---------- Foco: código, flujo mensual, boleta PLAME ---------- */
.code-b{background:#f6f8fa;border:1px solid var(--border);border-radius:6px;padding:8px 10px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px;white-space:pre;overflow:auto;margin:6px 0}
.flow{list-style:none;margin:0;padding:0}
.flow li{display:flex;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--border)}
.flow li:last-child{border-bottom:0}
.flow .n{width:30px;height:30px;border-radius:50%;border:2px solid var(--border);display:flex;align-items:center;justify-content:center;font-weight:700;color:var(--muted);flex:none}
.flow .b{flex:1;min-width:0}
.flow li.done .n{background:var(--green);border-color:var(--green);color:#fff}
.flow li.cur .n{border-color:var(--brand);color:var(--brand)}
.bplame{font-size:12.5px}
.bp-h{text-align:center;margin-bottom:8px;line-height:1.5}
table.bp{width:100%;border-collapse:collapse;margin-bottom:10px}
.bp th,.bp td{border:1px solid #cfd6dc;padding:4px 6px;text-align:left;vertical-align:top}
.bp th{background:#eef2f5;font-size:11px;font-weight:600;color:#334155}
.bp td.num{text-align:right;font-variant-numeric:tabular-nums}
.bp .bp-s td{background:#f6f8fa;font-weight:700}
.bp .bp-t td{background:var(--brand-l);font-weight:700}

/* ---------- Armazón: espacios, módulos (nivel 1) y secciones (nivel 2) ---------- */
.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
.shell{display:grid;grid-template-columns:84px auto minmax(0,1fr);grid-template-rows:56px 1fr;grid-template-areas:"hdr hdr hdr" "rail ctx main";min-height:100vh}
.logo-m{width:28px;height:28px;border-radius:7px;background:var(--brand);color:#fff;display:inline-flex;align-items:center;justify-content:center;font-size:11.5px;letter-spacing:.03em}
.hdr-sep{width:1px;height:24px;background:var(--border);margin:0 4px}
.hdr-emp{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:260px}
.hdr .burger{display:none;padding:0 8px}

  if (how === 'rechazar') return commentDlg('Rechazar solicitud', 'Motivo del rechazo', 'Rechazar', c => { confirmDlg('Confirmar rechazo', `¿Rechazar ${r.id} de ${shortName(W(r.workerId))}? Esta decisión es final y se notificará tu comentario.`, 'Rechazar', () => { r.estado = 'Rechazada'; reqHist(r, 'Rechazó', c); audit(REQ_TYPES[r.tipo], r.id, 'Rechazo', 'Estado', 'Pendiente', 'Rechazada', c); notify(r.by, `Tu solicitud ${r.id} fue rechazada: ${c}`, 'solicitud/' + r.id); if (r.tipo === 'CPT') S.concepts.find(x => x.id === r.data.conceptId).estado = 'Rechazado'; if (r.tipo === 'CES') { const cs = S.ceses.find(x => x.reqId === r.id); if (cs) cs.estado = 'Rechazado'; W(r.workerId).estado = 'Activo'; } after('Solicitud rechazada.'); }, true); }, true);
  const doIt = () => { try { const msg = applyApproval(r, how); after(msg); } catch (e) { if (e.message !== 'saldo') throw e; } };
  if (r.tipo === 'PLA') return confirmDlg('Aprobar y cerrar planilla', `Al aprobar, la planilla de ${S.planilla.nombre} quedará cerrada y no podrá modificarse. Se generará la orden de pago por ${money(r.data.neto)}. ¿Continuar?`, 'Aprobar y cerrar', doIt);
  if (r.tipo === 'CES') return confirmDlg('Aprobar cese', `Se crearán las tareas de salida, la liquidación y el pendiente de baja en T-Registro de ${fullName(W(r.workerId))}. ¿Continuar?`, 'Aprobar cese', doIt);
  doIt();
  function after(msg) { save(); closeDrawer(); ui.sel = null; toast(msg); render(); }
}
function applyApproval(r, how) {

  if (how === 'conocer') { r.estado = 'Aprobada'; reqHist(r, 'Tomó conocimiento'); notify(r.by, `Tu jefe tomó conocimiento de ${r.id}.`, 'solicitud/' + r.id); audit('Licencias', r.id, 'Toma de conocimiento', 'Estado', 'Pendiente', 'Aprobada'); return 'Licencia registrada. Se informó al trabajador.'; }
  const prev = r.estado;
  switch (r.tipo) {
    case 'VAC': { const disp = w.vacSaldo - (w.vacProg || 0); if (d.dias > disp) { toast('El saldo cambió desde la solicitud y ya no alcanza. Observa la solicitud.', 'err'); throw new Error('saldo'); } r.estado = 'Programada'; w.vacProg = (w.vacProg || 0) + d.dias; reqHist(r, 'Aprobó'); notify(r.by, `Tus vacaciones del ${fmt(d.desde)} al ${fmt(d.hasta)} fueron aprobadas.`, 'solicitud/' + r.id); break; }
    case 'PER': case 'JUS': r.estado = r.tipo === 'JUS' ? 'Justificada' : 'Aprobada'; reqHist(r, 'Aprobó'); if (r.tipo === 'JUS') S.att[w.id][d.fecha].just = 'Justificada'; notify(r.by, `Tu solicitud ${r.id} fue aprobada por ${me().nombre}.`, 'solicitud/' + r.id); break;
    case 'HEX': r.estado = 'Aprobada'; reqHist(r, 'Aprobó'); notify(r.by, `${me().nombre} aprobó las horas extras ${r.id}.`, 'horas-extras'); notify(S.users.find(u => u.workerId === w.id) ? S.users.find(u => u.workerId === w.id).id : null, `Tus horas extras del ${fmt(d.fecha)} fueron aprobadas.`, 'portal/solicitudes'); break;
    case 'ALT': r.estado = 'Validado'; w.estado = w.ingreso <= TODAY ? 'Activo' : 'Validado'; reqHist(r, 'Validó'); w.hist.push({ fecha: stamp(), usuario: me().nombre, accion: 'Alta validada', detalle: 'Estado ' + w.estado }); notify(r.by, `El alta de ${fullName(w)} fue validada.`, 'trabajador/' + w.id); S.tasks.push({ id: 'T' + Date.now(), userId: 'u-lucia', texto: `Registrar el alta de ${fullName(w)} en T-Registro (vence el ${fmt(w.ingreso)})`, ruta: 'trabajador/' + w.id, done: false }); notify('u-lucia', `Registra el alta de ${fullName(w)} en T-Registro.`, 'pendientes'); break;
    case 'CAM': r.estado = 'Aprobada'; d.cambios.forEach(c => { const k = { 'Banco': 'banco', 'Número de cuenta': 'cuenta', 'CCI': 'cci', 'Celular': 'celular', 'Correo personal': 'correo', 'Domicilio': 'domicilio', 'Contacto de emergencia': 'contacto' }[c[0]]; if (k) { audit('Trabajadores', fullName(w), 'Cambio aprobado', c[0], c[1], c[2], d.motivo); w[k] = c[2]; } }); w.hist.push({ fecha: stamp(), usuario: me().nombre, accion: `Cambio de ${d.seccion.toLowerCase()} aprobado`, detalle: d.cambios.map(c => c[0]).join(', ') }); reqHist(r, 'Aprobó'); notify(r.by, `Tu cambio de ${d.seccion.toLowerCase()} fue aprobado.`, 'portal/datos'); notify('u-lucia', `Cambio de ${d.seccion.toLowerCase()} aprobado para ${fullName(w)}.`, 'trabajador/' + w.id); break;
    case 'CPT': { const c = S.concepts.find(x => x.id === d.conceptId); c.estado = c.desde > TODAY ? 'Programado' : 'Vigente'; c.hist.push({ fecha: stamp(), usuario: me().nombre, accion: 'Aprobó', detalle: `Rige desde ${fmt(c.desde)}` }); reqHist(r, 'Aprobó'); r.estado = 'Aprobada'; usersByRole('ARH').concat(usersByRole('APL')).forEach(u => notify(u.id, `Concepto ${c.nombre} publicado. Rige desde ${fmt(c.desde)}.`, 'concepto/' + c.id)); notify(r.by, `El concepto ${c.nombre} fue aprobado.`, 'concepto/' + c.id); audit('Conceptos', c.nombre, 'Aprobación', 'Estado', 'Pendiente de aprobación', c.estado); return `Concepto publicado. Rige desde ${fmt(c.desde)}.`; }
    case 'PLA': r.estado = 'Aprobada'; S.planilla.estado = 'Cerrado'; S.planilla.hist.push({ fecha: stamp(), usuario: me().nombre, accion: 'Aprobó y cerró' }); reqHist(r, 'Aprobó y cerró'); notify('u-lucia', 'La planilla de octubre fue aprobada y cerrada. Ya puedes publicar las boletas.', 'boletas'); audit('Planilla', S.planilla.nombre, 'Aprobación', 'Estado', 'En revisión', 'Cerrado'); return 'Planilla aprobada y cerrada. Se generó la orden de pago.';
    case 'MOV': { r.estado = 'Aplicado'; const k = d.campo; audit('Trabajadores', fullName(w), 'Movimiento aplicado', d.tipo, d.antes, d.despues, d.motivo); w[k] = k === 'remuneracion' ? Number(d.valor) : d.valor; w.hist.push({ fecha: stamp(), usuario: me().nombre, accion: d.tipo, detalle: `${d.antes} → ${d.despues} · rige desde ${fmt(d.efectiva)}` }); reqHist(r, 'Aprobó y aplicó'); notify(r.by, `Movimiento ${r.id} aprobado y aplicado.`, 'trabajador/' + w.id); if (d.efectiva < PERIODO.desde) notify('u-lucia', `Movimiento retroactivo de ${fullName(w)}: generar diferencia en planilla.`, 'planilla'); break; }
    case 'CES': { r.estado = 'Aprobada'; reqHist(r, 'Aprobó el cese'); const cs = S.ceses.find(x => x.reqId === r.id); cs.estado = 'Cese aprobado'; cs.hist.push({ fecha: stamp(), usuario: me().nombre, accion: 'Aprobó el cese' }); w.estado = 'En cese'; S.tasks.push({ id: 'T' + Date.now(), userId: 'u-lucia', texto: `Registrar la baja de ${fullName(w)} en T-Registro (vence el ${fmt(addDays(cs.fecha, 1))})`, ruta: 'cese/' + cs.id, done: false }); notify('u-lucia', `Cese aprobado: calcular la liquidación de ${fullName(w)}.`, 'cese/' + cs.id); notify(r.by, `El cese de ${fullName(w)} fue aprobado.`, 'cese/' + cs.id); break; }
  }
  audit(REQ_TYPES[r.tipo], r.id, 'Aprobación', 'Estado', prev, r.estado);
  return r.tipo === 'ALT' ? 'Trabajador validado.' : r.tipo === 'VAC' ? `Vacaciones aprobadas. ${shortName(w)} recibirá la notificación.` : `Solicitud aprobada. ${r.by ? U(r.by).nombre : 'El solicitante'} recibirá la notificación.`;
}

function runSearch(q) {

  }

   10. Trabajadores — UI-TRA-001 Listado · RF-TRA-001, RF-TRA-002
--------------------------------------------------------------------------- */
function workerRows() {
  const f = ui.flt; const q = (f.q || '').toLowerCase();
  const qs = new URLSearchParams(location.hash.split('?')[1] || ''); if (qs.get('f') && !f.chip) f.chip = qs.get('f');
  return S.workers.filter(w => inScope(w) || (w.estado === 'Borrador' && w.empresa === S.session.empresa)).filter(w => {
    if (q && !(fullName(w).toLowerCase().includes(q) || w.doc.includes(q))) return false;
    if (f.sede && w.sede !== f.sede) return false; if (f.area && w.area !== f.area) return false;
    const chip = f.chip || 'act';
    if (chip === 'act' && w.estado !== 'Activo') return false;
    if (chip === 'venc' && !(w.finContrato && diffDays(TODAY, w.finContrato) >= 0 && diffDays(TODAY, w.finContrato) <= 30 && w.estado === 'Activo')) return false;
    if (chip === 'alta' && !['Borrador', 'Pendiente de validación', 'Observado', 'Validado'].includes(w.estado)) return false;
    if (chip === 'ces' && !['Cesado', 'En cese'].includes(w.estado)) return false;
    return true;
  });
}

--------------------------------------------------------------------------- */
const RES = { OK: ['✓', 'Completo'], TARD: ['⏱', 'Tardanza'], SAL: ['↘', 'Salida anticipada'], FALTA: ['✗', 'Inasistencia'], INC: ['◐', 'Marcación incompleta'], CONC: ['◆', 'Completo con concepto'], VAC: ['V', 'Vacaciones / licencia'], JUST: ['J', 'Justificada'], FER: ['F', 'Feriado o día libre'], FERW: ['F+', 'Laboró en día no laborable'], ACT: ['A', 'Actividad de la empresa'], COL: ['◑', 'Salida colectiva'] };

}

function vacKardex(w, reg) {
  const der = reg === 'Pequeña empresa' || reg === 'Microempresa' ? 15 : 30; const y0 = Number(w.ingreso.slice(0, 4)); const out = [];
  for (let y = y0; y < 2026; y++) { const cumple = `${y + 1}${w.ingreso.slice(4)}`; if (cumple > TODAY) break; const last = y === 2025 || `${y + 2}${w.ingreso.slice(4)}` > TODAY; const vend = !last && (y - y0) % 3 === 1 ? Math.min(15, der / 2) : 0;
    const saldo = last ? Math.min(der, w.vacSaldo) : 0; out.push({ per: `${y}-${y + 1}`, gen: fmt(cumple), der, goz: der - vend - saldo - (last ? 0 : 0), vend, saldo, vence: last ? fmt(w.vacVence) : '—' }); }
  (S.vacMov || []).filter(m => m.wid === w.id).forEach(m => { const p = out.find(x => x.per === m.per) || out[out.length - 1]; if (p) { if (m.tipo === 'Venta') p.vend += m.dias; else p.goz += m.dias; p.saldo = Math.max(0, p.saldo - m.dias); } });
  return out;
}

--------------------------------------------------------------------------- */
const ccOf = w => (allAreas().find(a => a.id === w.area) || {}).cc || 'CC-100';
const destOf = cc => ['CC-510', 'CC-520'].includes(cc) ? '921' : cc === 'CC-400' ? '951' : '941';
function asientoCalc() {
  const D = {}, H = {}; const add = (o, k, m) => { o[k] = (o[k] || 0) + m; };
  planillaWorkers().forEach(w => { const L = boletaLines(w, novedades(w)); const cc = ccOf(w);
    L.forEach(l => { if (l.m == null) return; const c = cpla(l.k);
      if (l.g === 'ing') add(D, (c.d || '6211') + '|' + cc, l.m);
      else if (l.g === 'desc' && l.base) add(D, '6211|' + cc, -l.m);
      else if (l.g === 'desc') add(H, c.h + '|', l.m);
      else if (l.g === 'emp') { add(D, '6271|' + cc, l.m); add(H, '4031|', l.m); } });
    add(H, '4111|', netOf(L)); });
  const rows = Object.entries(D).map(([k, m]) => ({ cta: k.split('|')[0], cc: k.split('|')[1], debe: r2(m), haber: 0 })).sort((a, b) => (a.cta + a.cc) < (b.cta + b.cc) ? -1 : 1).concat(Object.entries(H).map(([k, m]) => ({ cta: k.split('|')[0], cc: '', debe: 0, haber: r2(m) })).sort((a, b) => a.cta < b.cta ? -1 : 1));
  const td = r2(rows.reduce((a, r) => a + r.debe, 0)), th = r2(rows.reduce((a, r) => a + r.haber, 0));
  const dest = {}; rows.filter(r => r.debe).forEach(r => add(dest, destOf(r.cc), r.debe));
  return { rows, td, th, dest };
}

function nextWorkday(d) { let x = addDays(d, 1); while ([0, 6].includes(dOf(x).getDay()) || (S.feriados || []).some(f => f.fecha === x && ['Nacional', 'Empresa'].includes(f.tipo) && !f.sedes.length)) x = addDays(x, 1); return x; }
const habiles = (a, b) => { let n = 0, x = a; while (x <= b) { if (![0, 6].includes(dOf(x).getDay())) n++; x = addDays(x, 1); } return n; };
function vacState(r) {
  const d = r.data; const n = diffDays(d.desde, d.hasta) + 1; const ret = nextWorkday(d.hasta);
  if (PENDING.includes(r.estado)) return { k: 'pend', t: 'Pendiente de aprobación', n, ini: diffDays(TODAY, d.desde), ret };
  if (TODAY < d.desde) return { k: 'prox', t: 'Programada', n, ini: diffDays(TODAY, d.desde), ret };
  if (TODAY <= d.hasta) { const dia = diffDays(d.desde, TODAY) + 1; return { k: 'goce', t: 'En goce', n, dia, hab: habiles(d.desde, TODAY), falta: n - dia, ret }; }
  return { k: 'fin', t: 'Gozada', n, ret, hace: diffDays(ret, TODAY) };
}
const vacList = ws => S.reqs.filter(r => r.tipo === 'VAC' && ['Programada', 'En goce', 'Gozada', 'Pendiente de aprobación'].includes(r.estado) && ws.find(w => w.id === r.workerId)).map(r => ({ r, w: W(r.workerId), s: vacState(r) }));

  <div class="card"><h2>Próximas salidas (60 días)</h2>${table([{ t: 'Trabajador', f: x => `<b>${esc(fullName(x.w))}</b>` }, { t: 'Inicia en', num: 1, f: x => `<b>${x.s.ini} días</b>` }, { t: 'Desde – hasta', f: x => `${fmt(x.r.data.desde)} – ${fmt(x.r.data.hasta)}` }, { t: 'Días', num: 1, f: x => x.s.n }, { t: 'Retorna el', f: x => fmt(x.s.ret) }, { t: 'Estado', f: x => badge(x.s.t) }, { t: '', f: x => `<button class="btn text sm" data-go="solicitud/${x.r.id}">${x.r.id}</button>` }], prox, { noPage: 1, empty: 'No hay vacaciones programadas en los próximos 60 días.' })}</div>

document.addEventListener('click', e => {
  const pop = $('.menu-pop'); if (pop && !e.target.closest('.menu-pop') && !e.target.closest('[data-act=profile]')) pop.remove();
  const sr = $('#gres'); if (sr && !e.target.closest('.search')) sr.hidden = true;
  const f = e.target.closest('[data-focus]'); if (f) { e.preventDefault(); const t = document.getElementById(f.dataset.focus); if (t) t.focus(); return; }
  const a = e.target.closest('[data-act]');
  if (a && !a.disabled && a.getAttribute('aria-disabled') !== 'true' && a.tagName !== 'SELECT') { const fn = ACT[a.dataset.act]; if (fn) { if (a.tagName !== 'INPUT') e.preventDefault(); fn(a); if (a.closest('.side') && a.dataset.act !== 'mtoggle') $('#side').classList.remove('open'); return; } }
  const g = e.target.closest('[data-go]');
  if (g && !g.disabled) { e.preventDefault(); $$('.menu-pop').forEach(m => m.remove()); const sb = $('#side'); if (sb) sb.classList.remove('open'); if (g.closest('#modal-root')) closeModal(); if (g.closest('#drawer-root')) closeDrawer(); if (sr) sr.hidden = true; go(g.dataset.go); return; }
  if (e.target.closest('.side a')) { const sb = $('#side'); if (sb) sb.classList.remove('open'); }
});
let fltT;
document.addEventListener('input', e => {
  const t = e.target;
  if (t.id === 'gsearch') return runSearch(t.value.trim());
  if (t.dataset && t.dataset.flt && t.tagName === 'INPUT' && t.type !== 'checkbox') { clearTimeout(fltT); fltT = setTimeout(() => { ui.flt[t.dataset.flt] = t.value; ui.page = 1; rerender(); }, 250); }
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.id === 'ctx-emp') { S.session.empresa = t.value; save(); toast(`Ahora estás viendo: ${empresa(t.value).razon}`, 'info'); return render(); }
  if (t.id === 'ctx-sede') { S.session.sede = t.value; save(); toast(`Ahora estás viendo: ${t.value === 'Todas' ? 'todas las sedes' : 'sede ' + t.value}`, 'info'); return render(); }
  if (t.id === 'role-sw') { $$('.menu-pop').forEach(m => m.remove()); closeDrawer(); ui.wiz = null; ui.flt = {}; return login(t.value); }
  if (t.dataset && t.dataset.flt && (t.tagName === 'SELECT' || t.type === 'checkbox')) { ui.flt[t.dataset.flt] = t.type === 'checkbox' ? (t.checked ? '1' : '') : t.value; ui.page = 1; return rerender(); }
  if (t.dataset && t.dataset.actChange && ACTC[t.dataset.actChange]) return ACTC[t.dataset.actChange](t);
  if (t.closest && t.closest('.opt')) { const g = t.name; $$(`input[name="${g}"]`).forEach(r => r.closest('.opt') && r.closest('.opt').classList.toggle('on', r.checked)); }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { if ($('.menu-pop')) return $('.menu-pop').remove(); if (modalStack.length) return closeModal(); if ($('#drawer-root').innerHTML) return closeDrawer(); }
  if (e.key === 'Enter' && e.target.matches('tr[data-go],tr[data-act],.item[data-act],td[data-act]')) { e.preventDefault(); e.target.click(); }
  if (e.key === 'Enter' && e.target.id === 'gsearch') { const b = $('#gres button'); if (b) b.click(); }
  if (e.key === 'Enter' && e.target.id === 'rq') ACT.rqsearch();
  if (e.key === '/' && !/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName) && $('#gsearch')) { e.preventDefault(); $('#gsearch').focus(); }
});
window.addEventListener('hashchange', () => { closeDrawer(); render(); });
